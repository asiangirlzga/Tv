name: Build and Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # One-time setup: add these 4 secrets in GitHub > Settings > Secrets and variables > Actions
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  # Every run gets a higher version, so each APK can be installed over the previous one.
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK is preinstalled on ubuntu-latest.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Same signing key on every build = Android accepts the APK as an update.
      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      - name: Warn if no signing key
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "::warning::No KEYSTORE_BASE64 secret set. Using a temporary debug key, so this APK cannot update an earlier install."

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "HindiTV-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HindiTV-${{ env.VERSION_NAME }}
          path: HindiTV-${{ env.VERSION_NAME }}.apk

      # Publishes a new GitHub Release for every build, with the APK attached.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Hindi TV ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: HindiTV-${{ env.VERSION_NAME }}.apk
