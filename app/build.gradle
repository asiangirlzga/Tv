plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lite.hinditv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lite.hinditv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Debug-signed so the release APK can be sideloaded directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies on purpose: the framework VideoView plays HLS natively,
// which keeps the APK tiny and RAM use low.
