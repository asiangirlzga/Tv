plugins {
    id 'com.android.application'
}

// CI passes these in. Locally they fall back to defaults.
def appVersionCode = (System.getenv('VERSION_CODE') ?: '2').toInteger()
def appVersionName = System.getenv('VERSION_NAME') ?: '1.1'
def keystorePath   = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.lite.hinditv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lite.hinditv'
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Real key when provided (needed for updates), otherwise the debug key.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Only the core player + HLS. No UI module, to keep the APK small.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
}
